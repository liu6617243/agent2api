name: build-windows

# 只构建 Windows 桌面端安装包（NSIS exe），产物**直传**（archive:false）——
# Actions 页下载下来的就是 exe 本体，不再被 GitHub 包一层 zip。
#
# ── 为什么另起一条，而不是改 build.yml ────────────────────────
# 上游 3.3.0 起把 build.yml 改成了「只派发」：它向
# `Agent2Builder/agent2api-releases` 发一条 repository_dispatch，真正的编译
# 在**那个构建仓**里跑（签名私钥也在那边）。本仓库没有那个仓的权限，所以
# 那条流水线在本 fork 里永远出不了包。这里补一条自建流水线，让本仓库自己
# 就能产出可安装的 exe。
#
# ── 触发面 ───────────────────────────────────────────────────
# 只在本分支被推送、或手动触发时跑；主仓原有的 build.yml / docker.yml
# 只认 tag 与手动触发，互不干扰。
#
# ── 与旧 fork（v3.1.0 线）的关系 ──────────────────────────────
# 步骤逐条对齐那边跑通过的那份：Node 22 + stable Rust + `npm ci` +
# `npm run build`（= tauri build，targets 为 nsis）。

on:
  push:
    branches: [v3.3.0-beta.3]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # 依赖与 lock 都在 desktop-tauri/ 下
          cache: npm
          cache-dependency-path: desktop-tauri/package-lock.json

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 依赖
        uses: Swatinem/rust-cache@v2
        with:
          # src-tauri/.cargo/config.toml 把 target-dir 指到了项目根
          workspaces: desktop-tauri/src-tauri -> ../../target

      - name: 安装桌面端依赖
        run: npm --prefix desktop-tauri ci

      - name: 构建 Windows 安装包（tauri build，targets=nsis）
        run: npm --prefix desktop-tauri run build

      - name: 列出产物
        run: dir target\release\bundle\nsis

      - name: 上传 exe（单文件直传，不包 zip）
        uses: actions/upload-artifact@v7
        with:
          # archive:false 时 name 参数被忽略，artifact 名即文件名
          path: target/release/bundle/nsis/*.exe
          archive: false
          if-no-files-found: error
